[package]
name = "celld"
version = "0.0.2"
edition = "2021"
rust-version = "1.94.1"
license = "MIT"

[package.metadata.release]
litestream-version = "v0.5.15"
litestream-commit = "5a2624418478f358cf85ed7d4606eb55029194ec"

[lib]
path = "lib.rs"

[[bin]]
name = "celld"
path = "main.rs"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(celld_internal_tests)", "cfg(celld_proxy_internals)"]

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
aws-sdk-s3 = "1"
aws-smithy-http-client = "1"
axum = { version = "0.7", features = ["multipart"] }
base64 = "0.22"
celld-logic = { path = "../logic" }
celld-ltx = { path = "../ltx", features = ["s3"] }
deno_core_icudata = "0.77"
encoding_rs = "0.8"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
fastwebsockets = { version = "0.8", default-features = false, features = ["upgrade", "with_axum"] }
filetime = "0.2"
flate2 = "1"
fs2 = "0.4"
futures-util = "0.3"
getrandom = "0.3"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
md-5 = "0.10"
percent-encoding = "2"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
rusqlite = { version = "0.31", features = ["backup", "bundled", "hooks"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
rsa = { version = "0.9", features = ["sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["io", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
urlpattern = "=0.4.2"
v8 = "152"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
